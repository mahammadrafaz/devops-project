{% extends 'auth/base.html' %}{% block title %}Join {{ invitation.business.name }} · StockFlow{% endblock %}{% block content %}<section class="accept-wrap"><div class="form-card"><div class="eyebrow">You’re invited</div><h2>Join {{ invitation.business.name }}</h2><p class="muted">Create your {{ invitation.role }} account with <strong>{{ invitation.email }}</strong>.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Your name<input name="name" autocomplete="name" required></label><label>Password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label><button class="primary">Accept invitation <span>→</span></button></form></div></section>{% endblock %}
