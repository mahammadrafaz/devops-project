{% extends 'auth/base.html' %}{% block title %}{{ 'Edit' if product else 'Add' }} product · StockFlow{% endblock %}{% block content %}<section class="dashboard narrow"><div class="eyebrow">Inventory</div><h1>{{ 'Edit product' if product else 'Add a product' }}</h1><p class="muted">Keep product details and stock levels current.</p><div class="panel"><form class="product-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="name" maxlength="160" required value="{{ request.form.get('name', product.name if product else '') }}"></label><label>SKU<input name="sku" maxlength="80" required value="{{ request.form.get('sku', product.sku if product else '') }}"></label><label>Description<textarea name="description" rows="3">{{ request.form.get('description', product.description if product else '') }}</textarea></label><label>Category<select name="category_id"><option value="">No category</option>{% for c in categories %}<option value="{{ c.id }}" {% if request.form.get('category_id', product.category_id if product else '')|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><div class="two-col"><label>Purchase price<input type="number" name="purchase_price" min="0" step="0.01" required value="{{ request.form.get('purchase_price', product.purchase_price if product else '0.00') }}"></label><label>Selling price<input type="number" name="selling_price" min="0" step="0.01" required value="{{ request.form.get('selling_price', product.selling_price if product else '0.00') }}"></label></div><div class="two-col"><label>Current quantity<input type="number" name="quantity" min="0" step="1" required value="{{ request.form.get('quantity', product.quantity if product else 0) }}"></label><label>Low-stock threshold<input type="number" name="low_stock_threshold" min="0" step="1" required value="{{ request.form.get('low_stock_threshold', product.low_stock_threshold if product else 5) }}"></label></div><div class="actions"><button class="primary">{{ 'Save changes' if product else 'Add product' }}</button><a class="secondary" href="{{ url_for('inventory.index') }}">Cancel</a></div></form></div></section>{% endblock %}
