
name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mahammadrafaz/devops-project:latest
            mahammadrafaz/devops-project:sha-${{ github.sha }}

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::920887851398:role/github-actions-ec2-deploy
          aws-region: eu-north-1

      - name: Deploy through AWS Systems Manager
        if: github.event_name == 'push'
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail

          test -n "$EC2_INSTANCE_ID"
          test -n "$IMAGE_TAG"

          DEPLOY_SCRIPT=$(cat <<'SCRIPT'
          set -e

          IMAGE="mahammadrafaz/devops-project:__IMAGE_TAG__"

          echo "Pulling image: $IMAGE"
          sudo docker pull "$IMAGE"

          echo "Replacing existing container..."
          sudo docker rm -f devops-flask || true

          echo "Starting updated container..."
          sudo docker run -d \
            --name devops-flask \
            -p 5000:5000 \
            --restart unless-stopped \
            "$IMAGE"

          echo "Checking application health..."
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo "Deployment successful!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed!"
          sudo docker logs devops-flask --tail 50
          exit 1
          SCRIPT
          )

          DEPLOY_SCRIPT="${DEPLOY_SCRIPT//__IMAGE_TAG__/$IMAGE_TAG}"

          PARAMETERS=$(jq -n --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy devops-project from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --output json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
